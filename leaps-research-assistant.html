<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAPS Research Assistant | AI-Powered Options Intelligence</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#09090b;color:#f4f4f5;line-height:1.5;min-height:100vh}
:root{
  --bg:#09090b;--bg-card:#18181b;--bg-el:#27272a;
  --border:#3f3f46;--border-sub:#27272a;
  --text:#f4f4f5;--text2:#a1a1aa;--muted:#71717a;
  --green:#10b981;--green-d:rgba(16,185,129,.12);
  --red:#f43f5e;--red-d:rgba(244,63,94,.12);
  --yellow:#f59e0b;--yellow-d:rgba(245,158,11,.12);
  --blue:#3b82f6;--blue-d:rgba(59,130,246,.12);
  --sw:240px;--hh:60px;--r:8px;--rl:12px
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#app{min-height:100vh}
/* LAYOUT */
.layout{display:grid;grid-template-columns:var(--sw) 1fr;grid-template-rows:var(--hh) 1fr;min-height:100vh}
.sidebar{grid-row:1/-1;background:var(--bg-card);border-right:1px solid var(--border-sub);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:18px 20px 14px;border-bottom:1px solid var(--border-sub)}
.sb-logo .lt{font-size:14px;font-weight:700;color:var(--green);letter-spacing:-.02em}
.sb-logo .ls{font-size:11px;color:var(--muted);margin-top:2px}
.sb-nav{flex:1;padding:10px 0}
.nav-sec{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 20px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 20px;font-size:13px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.ni:hover{color:var(--text);background:var(--bg-el)}
.ni.active{color:var(--green);border-left-color:var(--green);background:var(--green-d)}
.sb-foot{padding:14px 20px;border-top:1px solid var(--border-sub)}
.u-pill{display:flex;align-items:center;gap:9px}
.u-av{width:30px;height:30px;background:var(--green-d);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green);flex-shrink:0}
.u-nm{font-size:13px;font-weight:500}
.u-em{font-size:11px;color:var(--muted)}
.btn-lo{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 0;margin-top:6px;text-align:left;transition:color .15s;font-family:inherit}
.btn-lo:hover{color:var(--red)}
.header{background:var(--bg-card);border-bottom:1px solid var(--border-sub);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.hd-title{font-size:16px;font-weight:600}
.hd-sub{font-size:12px;color:var(--muted);margin-top:1px}
.main{padding:28px;overflow-y:auto;background:var(--bg)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;font-weight:500;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-p{background:var(--green);color:#000}
.btn-p:hover{background:#059669}
.btn-s{background:var(--bg-el);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{background:var(--border)}
.btn-d{background:var(--red-d);color:var(--red);border:1px solid rgba(244,63,94,.3)}
.btn-d:hover{background:rgba(244,63,94,.2)}
.btn-g{background:none;color:var(--text2);border:1px solid var(--border-sub)}
.btn-g:hover{background:var(--bg-el);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ct{font-size:14px;font-weight:600}
.cs{font-size:12px;color:var(--muted);margin-top:2px}
/* FORMS */
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.fi,.fsel,.fta{width:100%;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;padding:9px 12px;transition:border-color .15s;font-family:inherit}
.fi:focus,.fsel:focus,.fta:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px var(--green-d)}
.fta{resize:vertical;min-height:70px}
.fsel{cursor:pointer}
.fi::placeholder{color:var(--muted)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.cb-group{display:flex;flex-wrap:wrap;gap:7px}
.cb-item{display:flex;align-items:center;gap:5px;padding:5px 11px;background:var(--bg-el);border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2);user-select:none}
.cb-item input{display:none}
.cb-item.checked{background:var(--green-d);border-color:var(--green);color:var(--green)}
/* TABLES */
.tw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--border-sub)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--bg-el);padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border-sub)}
tbody td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border-sub);color:var(--text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-el)}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:var(--green-d);color:var(--green)}
.br{background:var(--red-d);color:var(--red)}
.by{background:var(--yellow-d);color:var(--yellow)}
.bb{background:var(--blue-d);color:var(--blue)}
.bw{background:var(--bg-el);color:var(--text2)}
/* SCORE GAUGE */
.sg{display:flex;flex-direction:column;align-items:center;gap:8px}
.sc{position:relative;width:130px;height:130px}
.sc svg{transform:rotate(-90deg)}
.sc-bg{fill:none;stroke:var(--bg-el);stroke-width:9}
.sc-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.sn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.sn .num{font-size:30px;font-weight:800;line-height:1}
.sn .lbl{font-size:10px;color:var(--muted);margin-top:2px}
/* PROGRESS */
.pb{height:5px;background:var(--bg-el);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .8s ease}
/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-sub);margin-bottom:20px}
.tab{padding:8px 16px;font-size:13px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;margin-bottom:-1px;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;display:flex;align-items:flex-start;gap:9px;line-height:1.5}
.al-d{background:var(--red-d);border:1px solid rgba(244,63,94,.3);color:var(--red)}
.al-g{background:var(--green-d);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.al-y{background:var(--yellow-d);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
.al-b{background:var(--blue-d);border:1px solid rgba(59,130,246,.3);color:var(--blue)}
/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;gap:14px;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--bg-el);border-top-color:var(--green);border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* LANDING */
.land{background:var(--bg);min-height:100vh}
.land-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border-sub)}
.land-logo{font-size:15px;font-weight:700;color:var(--green)}
.hero{max-width:860px;margin:0 auto;padding:80px 48px 60px;text-align:center}
.hero-tag{display:inline-block;padding:3px 12px;background:var(--green-d);border:1px solid rgba(16,185,129,.3);border-radius:20px;font-size:12px;color:var(--green);font-weight:500;margin-bottom:22px}
.hero h1{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-.04em;margin-bottom:18px}
.hero h1 span{color:var(--green)}
.hero p{font-size:17px;color:var(--text2);max-width:580px;margin:0 auto 32px;line-height:1.65}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.feats{max-width:1060px;margin:0 auto;padding:56px 48px}
.sec-title{text-align:center;font-size:26px;font-weight:700;margin-bottom:6px}
.sec-sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:44px}
.feats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.fc{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:22px}
.fi-icon{width:38px;height:38px;background:var(--green-d);border-radius:var(--r);display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:18px}
.fc h3{font-size:14px;font-weight:600;margin-bottom:7px}
.fc p{font-size:13px;color:var(--text2);line-height:1.6}
/* AUTH */
.auth-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:38px;width:100%;max-width:390px}
.auth-logo{font-size:19px;font-weight:700;color:var(--green);text-align:center;margin-bottom:6px}
.auth-ttl{font-size:21px;font-weight:700;text-align:center;margin-bottom:5px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:26px}
.auth-sw{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.auth-sw a{color:var(--green);cursor:pointer}
/* ONBOARDING */
.ob-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.ob-card{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:38px;width:100%;max-width:540px}
.step-ind{display:flex;gap:5px;margin-bottom:26px;justify-content:center}
.sd{width:7px;height:7px;border-radius:50%;background:var(--bg-el);transition:all .3s}
.sd.act{background:var(--green);width:22px;border-radius:4px}
.sd.done{background:var(--green);opacity:.45}
.opt-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-card{padding:12px 14px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s;font-size:13px}
.opt-card:hover{border-color:var(--green)}
.opt-card.sel{background:var(--green-d);border-color:var(--green);color:var(--green)}
/* DASHBOARD */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:18px}
.stat-l{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-v{font-size:22px;font-weight:700}
.stat-s{font-size:12px;color:var(--muted);margin-top:3px}
.opp{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:14px;cursor:pointer;transition:border-color .15s}
.opp:hover{border-color:var(--green)}
.opp-tk{font-size:17px;font-weight:700}
.opp-nm{font-size:11px;color:var(--muted);margin-bottom:10px}
/* SCREENER */
.sr-res{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.s-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.s-rl{font-size:12px;color:var(--text2);min-width:130px}
.s-rv{font-size:12px;font-weight:600;min-width:40px;text-align:right}
/* REPORT */
.rc{font-size:14px;line-height:1.8;color:var(--text)}
.rc h3{font-size:15px;font-weight:600;color:var(--green);margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--green-d)}
.rc h3:first-child{margin-top:0}
.rc p{margin-bottom:11px}
.rc ul{padding-left:18px;margin-bottom:11px}
.rc li{margin-bottom:5px}
/* LEAPS CARDS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin:18px 0}
.rec{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:18px;position:relative}
.rec.fr{border-color:var(--green);background:linear-gradient(135deg,var(--bg-card) 0%,rgba(16,185,129,.06) 100%)}
.rec-rnk{position:absolute;top:14px;right:14px}
.fr-bdg{background:var(--green);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.04em}
.r-bdg{background:var(--bg-el);color:var(--muted);font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px}
.rec-sk{font-size:22px;font-weight:700;margin-bottom:1px}
.rec-ex{font-size:12px;color:var(--muted);margin-bottom:14px}
.rec-met{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.rm{background:var(--bg-el);border-radius:6px;padding:7px}
.rm-l{font-size:10px;color:var(--muted);margin-bottom:2px}
.rm-v{font-size:13px;font-weight:600}
.rec-rs{font-size:12px;color:var(--text2);line-height:1.6;border-top:1px solid var(--border-sub);padding-top:11px}
/* CHAT */
.chat-c{display:flex;flex-direction:column;height:380px;background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);overflow:hidden}
.chat-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cb{max-width:82%;padding:9px 13px;border-radius:11px;font-size:13px;line-height:1.6}
.cb.usr{background:var(--green);color:#000;align-self:flex-end;border-bottom-right-radius:3px}
.cb.ai{background:var(--bg-el);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px}
.cb .sndr{font-size:10px;font-weight:600;opacity:.65;margin-bottom:3px}
.chat-ir{display:flex;gap:7px;padding:10px;border-top:1px solid var(--border-sub)}
.chat-ir input{flex:1;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;padding:8px 11px;font-family:inherit}
.chat-ir input:focus{outline:none;border-color:var(--green)}
/* EMPTY */
.empty{text-align:center;padding:44px;color:var(--muted)}
.empty-ic{font-size:36px;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--text2)}
.empty p{font-size:13px}
/* MISC */
.ph{margin-bottom:22px}
.pt{font-size:21px;font-weight:700;margin-bottom:3px}
.ps{font-size:13px;color:var(--muted)}
.tg{color:var(--green)}
.tr{color:var(--red)}
.ty{color:var(--yellow)}
.tm{color:var(--muted)}
.div{border:none;border-top:1px solid var(--border-sub);margin:18px 0}
.qas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qa{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:18px;cursor:pointer;transition:all .15s;text-align:center}
.qa:hover{border-color:var(--green);background:var(--green-d)}
.qa-ic{font-size:26px;margin-bottom:7px}
.qa-l{font-size:12px;font-weight:500}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--bg-card);border:1px solid var(--border-sub);border-radius:var(--rl);padding:26px;width:100%;max-width:480px}
.modal-ttl{font-size:17px;font-weight:700;margin-bottom:18px}
.modal-act{display:flex;gap:7px;justify-content:flex-end;margin-top:22px}
input[type=range]{width:100%;accent-color:var(--green);cursor:pointer}
.rr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rrl{font-size:12px;color:var(--text2);min-width:155px}
.rrv{font-size:12px;font-weight:600;color:var(--green);min-width:34px;text-align:right}
.api-note{background:var(--yellow-d);border:1px solid rgba(245,158,11,.3);border-radius:var(--r);padding:11px 14px;font-size:12px;color:var(--yellow);margin-bottom:14px}
.sum-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-sub)}
.sum-row:last-child{border-bottom:none}
.sum-k{font-size:13px;color:var(--muted)}
.sum-v{font-size:13px;font-weight:500}
/* MARKET RECOMMENDATIONS */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.strat-card{text-align:left;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);padding:18px;cursor:pointer;transition:all .15s;color:var(--text);font-family:inherit;width:100%}
.strat-card:hover{border-color:var(--green)}
.strat-card.sel{background:var(--green-d);border-color:var(--green)}
.strat-card .sc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.strat-card .sc-t{font-size:15px;font-weight:700}
.strat-card .sc-z{font-size:11px;color:var(--muted);margin-bottom:10px}
.strat-card ul{list-style:none;padding:0;margin:0}
.strat-card li{font-size:12px;color:var(--text2);padding:2px 0 2px 16px;position:relative}
.strat-card li::before{content:'›';position:absolute;left:2px;color:var(--green)}
.strat-card.sel li{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--bg-el);border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2);font-family:inherit}
.chip:hover{border-color:var(--green)}
.chip.sel{background:var(--green-d);border-color:var(--green);color:var(--green)}
.chip.sel-x{background:var(--red-d);border-color:var(--red);color:var(--red)}
.mkt-env{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:6px}
.mkt-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.mkt-meta .mm{background:var(--bg-el);border-radius:8px;padding:9px 11px}
.mkt-meta .mm-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mkt-meta .mm-v{font-size:13px;font-weight:600;margin-top:2px}
.rec .rec-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
.rec .km{margin-top:10px;border-top:1px solid var(--border-sub);padding-top:9px}
.rec .km-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;gap:8px}
.rec .km-row .km-l{color:var(--muted)}
.rec .km-row .km-v{color:var(--text);font-weight:500;text-align:right}
.rec .km-row .km-s{color:var(--muted);font-size:10px}
.rec-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.risk-list{list-style:none;padding:0;margin:8px 0 0}
.risk-list li{font-size:12px;color:var(--text2);padding:2px 0 2px 15px;position:relative}
.risk-list li::before{content:'▴';position:absolute;left:0;color:var(--yellow);font-size:9px;top:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
button:focus-visible,.chip:focus-visible,.strat-card:focus-visible,.ni:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .hero h1{font-size:30px}
  .g2,.g3{grid-template-columns:1fr}
  .sr-res{grid-template-columns:1fr}
  .strat-grid{grid-template-columns:1fr}
  .land-nav{padding:14px 20px}
  .hero{padding:44px 20px 36px}
  .feats{padding:36px 20px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// MOCK DATA

  signup(e){
    e.preventDefault();
    const nm=document.getElementById('nm').value.trim();
    const em=document.getElementById('em').value.trim();
    const pw=document.getElementById('pw').value;
    if(!nm||!em||!pw){this.flash('err','All fields required.');return}
    if(pw.length<6){this.flash('err','Password must be at least 6 characters.');return}
    const users=JSON.parse(localStorage.getItem('leaps_users')||'[]');
    if(users.find(x=>x.email===em)){this.flash('err','Email already registered.');return}
    users.push({name:nm,email:em,password:pw,ob:null});
    localStorage.setItem('leaps_users',JSON.stringify(users));
    this.s.user={name:nm,email:em};this.s.ob=null;
    this.save();this.go('onboarding');

  // ============================================================
  // SCORING ENGINE
  // ============================================================
  score(m){
    const w=this.s.settings.weights;
    if(m.cf==='negative')return{score:0,dq:'Negative cash flow — disqualified',breakdown:{}};
    if(m.earn==='declining')return{score:0,dq:'Declining earnings — disqualified',breakdown:{}};
    if(m.rank==='other')return{score:0,dq:'Not a top-3 industry leader — disqualified',breakdown:{}};
    let bd={},tot=0;
    // Industry leadership
    const il=m.rank==='1'?w.industryLeadership:m.rank==='2'?Math.round(w.industryLeadership*.8):Math.round(w.industryLeadership*.6);
    bd.industryLeadership={max:w.industryLeadership,got:il,label:'Industry Leadership'};tot+=il;
    // Cash flow
    const cf=m.cf==='strong'?w.cashFlow:Math.round(w.cashFlow*.6);
    bd.cashFlow={max:w.cashFlow,got:cf,label:'Cash Flow Strength'};tot+=cf;
    // Earnings
    const ea=m.earn==='growing'?w.earnings:Math.round(w.earnings*.6);
    bd.earnings={max:w.earnings,got:ea,label:'Earnings Quality'};tot+=ea;
    // D/E
    const de=+m.de;
    const depts=de<0.5?w.debtEquity:de<1?Math.round(w.debtEquity*.7):de<1.5?Math.round(w.debtEquity*.4):Math.round(w.debtEquity*.1);
    bd.debtEquity={max:w.debtEquity,got:depts,label:'Debt-to-Equity'};tot+=depts;
    // EMA distance
    const dist=Math.abs((+m.price-+m.ema)/(+m.ema)*100);
    const ems=dist<=5?w.emaDistance:dist<=10?Math.round(w.emaDistance*.8):dist<=20?Math.round(w.emaDistance*.4):dist<=30?Math.round(w.emaDistance*.15):0;
    bd.emaDistance={max:w.emaDistance,got:ems,label:'200-Week EMA Zone'};tot+=ems;
    // Affordability & expiration default
    bd.affordability={max:w.affordability,got:w.affordability,label:'Affordability'};tot+=w.affordability;
    bd.expiration={max:w.expiration,got:w.expiration,label:'Option Expiration'};tot+=w.expiration;
    return{score:Math.min(100,tot),dq:null,breakdown:bd,emaDist:dist.toFixed(1)};
  },

  async callClaude(system,user,maxTokens=2048){
    const key=this.s.settings.apiKey;
    if(!key)return null;
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-allow-browser':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages:[{role:'user',content:user}]})
    });
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'API error')}
    const d=await r.json();return d.content[0].text;
  },

  demoLeaps(ticker,contracts){
    const sorted=[...contracts].sort((a,b)=>{
      let sa=0,sb=0;
      if(a.dep>=40)sa+=3;else if(a.dep>=35)sa+=2;
      if(b.dep>=40)sb+=3;else if(b.dep>=35)sb+=2;
      if(a.delta>=0.40&&a.delta<=0.65)sa+=2;
      if(b.delta>=0.40&&b.delta<=0.65)sb+=2;
      if(a.vol>b.vol)sa+=1;else sb+=1;
      return sb-sa;
    });
    const mockData={
      ranked:sorted.map((c,i)=>({
        rank:i+1,isFrontRunner:i===0,strike:c.strike,expiry:c.exp,premium:c.prem,
        riskLevel:i===0?'Moderate':i===1?'Moderate-High':'High',
        reasoning:i===0?`This is our top pick. At $${c.prem} per contract ($${(c.prem*100).toFixed(0)} per contract), it offers the best combination of delta (${c.delta}) and contract depreciation (${c.dep}% from highs). The ${c.vol} daily volume provides adequate liquidity.`:
          i===1?`A solid alternative with slightly different strike/expiration profile. Delta of ${c.delta} offers good leverage while the ${c.dep}% depreciation from highs suggests the premium has been reset to more attractive levels.`:
          `The most speculative of the three. Lower premium cost but also lower probability of profit. Consider this only if your purchasing power limits the top two choices.`,
        affordNote:c.prem<20?`Budget-friendly at ~$${(c.prem*100).toFixed(0)}/contract`:c.prem<50?`Moderate cost at ~$${(c.prem*100).toFixed(0)}/contract`:`Premium-priced at ~$${(c.prem*100).toFixed(0)}/contract`
      })),
      frontRunnerExplanation:`Contract #1 (${sorted[0].exp} $${sorted[0].strike} Call at $${sorted[0].prem}) is our front-runner because it combines a strong delta of ${sorted[0].delta} with ${sorted[0].dep}% depreciation from its all-time high, suggesting the premium has been meaningfully reset. The ${sorted[0].oi.toLocaleString()} open interest confirms solid institutional participation. This contract gives the investment adequate time (${sorted[0].exp}) to play out while keeping us close enough to in-the-money to benefit meaningfully from the underlying move.`,
      disclaimer:'⚠️ Demo analysis. Add your Anthropic API key in Settings for real AI recommendations. Not financial advice.'
    };
    return`<div class="alert al-y" style="margin-bottom:14px">Demo Mode — Add your API key in Settings for real AI analysis.</div>${this.renderRecs(mockData,contracts)}`;
  },

  async sendChat(e){
    e.preventDefault();
    const inp=document.getElementById('chat-inp');
    if(!inp)return;
    const msg=inp.value.trim();if(!msg)return;
    const ctx=this.s.params.ticker||'general';
    if(!this.s.chats[ctx])this.s.chats[ctx]=[];
    this.s.chats[ctx].push({role:'user',content:msg});
    inp.value='';this.renderChatMessages(ctx);
    const system=`You are a 20-year veteran investment analyst specializing in LEAPS call options and long-term equity investments. Context: analyzing ${ctx}. Be direct, analytical, experienced. Never promise returns. End every response with: "⚠️ Educational purposes only. Not financial advice."`;
    const msgs=this.s.chats[ctx].map(m=>({role:m.role,content:m.content}));
    const el=document.getElementById('chat-msgs');
    if(el){const typing=document.createElement('div');typing.className='cb ai';typing.id='typing';typing.innerHTML='<div class="sndr">LEAPS AI</div>…';el.appendChild(typing);el.scrollTop=el.scrollHeight}
    try{
      const ob=this.s.ob||{};
      const fullSys=`${system}\nUser profile: Purchasing power ${ob.purchasingPower||'not specified'}, Risk appetite ${ob.riskAppetite||'moderate'}, Industries: ${(ob.industries||[]).join(', ')}.`;
      const text=await this.callClaude(fullSys,msgs.map(m=>`${m.role==='user'?'User':'Assistant'}: ${m.content}`).join('\n\n'),1024);
      document.getElementById('typing')?.remove();
      const reply=text||`As an experienced investor, I'd say ${msg.toLowerCase().includes('risk')?'the primary risk here is time decay — LEAPS give you more runway but you still need the thesis to play out.':'this is a great question. The key with LEAPS is patience — you are buying time for the thesis to develop. Focus on the fundamentals, not short-term price moves.'} ⚠️ Educational purposes only. Not financial advice.`;
      this.s.chats[ctx].push({role:'assistant',content:reply});
      this.save();this.renderChatMessages(ctx);
    }catch{
      document.getElementById('typing')?.remove();
      const fb='I encountered an issue reaching the AI. Check your API key in Settings. ⚠️ Educational purposes only.';
      this.s.chats[ctx].push({role:'assistant',content:fb});
      this.renderChatMessages(ctx);
    }
  },

  renderChatMessages(ctx){
    const el=document.getElementById('chat-msgs');if(!el)return;
    const msgs=this.s.chats[ctx]||[];
    el.innerHTML=msgs.length?msgs.map(m=>`<div class="cb ${m.role==='user'?'usr':'ai'}"><div class="sndr">${m.role==='user'?'You':'LEAPS AI'}</div>${m.content}</div>`).join(''):`<div style="text-align:center;color:var(--muted);font-size:13px;padding:24px">Ask a follow-up question about this analysis…</div>`;
    el.scrollTop=el.scrollHeight;
  },

  fmt(text){
    return text
      .replace(/###\s+(.+)/g,'<h3>$1</h3>')
      .replace(/##\s+(.+)/g,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^[-•]\s+(.+)/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
      .replace(/\n\n+/g,'</p><p>')
      .replace(/^(?!<[hup])/gm,match=>match?`<p>${match}</p>`:'')
      .replace(/<p><\/p>/g,'')
      .replace(/<p>(<[hul])/g,'$1')
      .replace(/(<\/[hul][^>]*>)<\/p>/g,'$1');
  },

  renderScore(res){
    const {score,dq,breakdown,metrics,ticker,emaDist}=res;
    const col=this.scoreColor(score);
    const lbl=this.scoreLbl(score);
    if(dq){
      return`<div id="score-res" class="card"><div class="alert al-d"><strong>⛔ Disqualified: ${dq}</strong><br><span style="font-size:12px;opacity:.8">This company fails the minimum criteria for the investment framework. It would not be considered for LEAPS.</span></div></div>`;
    }
    const r=Math.PI*52;
    const pct=score/100;
    const dash=`${r*pct} ${r}`;
    const bArr=Object.values(breakdown);
    const bRows=bArr.map(b=>`<div class="s-row">
      <div class="s-rl">${b.label}</div>
      <div style="flex:1"><div class="pb"><div class="pf" style="width:${b.max?b.got/b.max*100:0}%;background:${b.got/b.max>=.8?'var(--green)':b.got/b.max>=.5?'var(--yellow)':'var(--red)'}"></div></div></div>
      <div class="s-rv" style="color:${b.got/b.max>=.7?'var(--green)':'var(--text2)'}">${b.got}/${b.max}</div>
    </div>`).join('');
    return`<div id="score-res" class="card">
      <div class="ct" style="margin-bottom:16px">Score Result: <strong>${ticker||'Custom'}</strong></div>
      <div class="sr-res">
        <div class="sg">
          <div class="sc">
            <svg viewBox="0 0 120 120" width="130" height="130">
              <circle class="sc-bg" cx="60" cy="60" r="52"/>
              <circle class="sc-fill" cx="60" cy="60" r="52" stroke="${col}" stroke-dasharray="${dash}" stroke-dashoffset="0"/>
            </svg>
            <div class="sn"><div class="num" style="color:${col}">${score}</div><div class="lbl">/ 100</div></div>
          </div>
          <span class="badge ${score>=90?'bg':score>=80?'bg':score>=65?'by':'br'}">${lbl}</span>
          ${emaDist?`<div style="font-size:12px;color:var(--muted);text-align:center">${emaDist}% from 200W EMA</div>`:''}
        </div>
        <div>
          <div style="font-size:13px;font-weight:600;margin-bottom:12px">Score Breakdown</div>
          ${bRows}
          <hr class="div">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-p btn-sm" onclick="App.go('research',{ticker:'${ticker||'CUSTOM'}'})">${ticker?`→ AI Report for ${ticker}`:'→ Generate AI Report'}</button>
            <button class="btn btn-g btn-sm" onclick="App.go('leaps',{ticker:'${ticker||'CUSTOM'}'})">${ticker?`→ LEAPS for ${ticker}`:'→ LEAPS Ideas'}</button>
          </div>
        </div>
      </div>
    </div>`;
  },

      <div class="ct" style="margin-bottom:14px">Data Management</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-g btn-sm" onclick="App.exportData()">Export Data (JSON)</button>
        <button class="btn btn-d btn-sm" onclick="if(confirm('Clear all app data? This cannot be undone.'))App.clearData()">Clear All Data</button>
      </div>
    </div>`;
  },

  saveApiKey(){
    const key=document.getElementById('api-key').value.trim();
    this.s.settings.apiKey=key;this.save();
    this.flash('ok',key?'API key saved. AI features are now enabled.':'API key cleared.');
    this.render();
  },

  updateWeightTotal(){
    const keys=['industryLeadership','cashFlow','earnings','debtEquity','emaDistance','affordability','expiration'];
    const total=keys.reduce((s,k)=>s+(+document.getElementById(`w-${k}`).value||0),0);
    const el=document.getElementById('weight-total');
    if(el){el.textContent=total;el.style.color=total===100?'var(--green)':'var(--red)'}
  },

  saveWeights(){
    const keys=['industryLeadership','cashFlow','earnings','debtEquity','emaDistance','affordability','expiration'];
    const total=keys.reduce((s,k)=>s+(+document.getElementById(`w-${k}`).value||0),0);
    if(total!==100){this.flash('err',`Weights must total 100. Currently: ${total}`);return}
    keys.forEach(k=>{this.s.settings.weights[k]=+document.getElementById(`w-${k}`).value});
    this.save();this.flash('ok','Scoring weights saved.');
  },

  exportData(){
    const data=JSON.stringify(this.s,null,2);
    const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(data);
    a.download='leaps-research-data.json';a.click();
  },

  clearData(){
    localStorage.removeItem('leaps_app');location.reload();
  },

  // ============================================================
  // MARKET RECOMMENDATIONS
  // ============================================================
  esc(s){
    if(s==null)return'';
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },

  mktPrefill(){
    const m=this.s.market,ob=this.s.ob||{};
    if(!m.riskTolerance){const r=ob.riskAppetite;m.riskTolerance=['Conservative','Moderate','Aggressive'].includes(r)?r:'Moderate';}
    if(!m.preferredIndustries.length&&Array.isArray(ob.industries))m.preferredIndustries=[...ob.industries];
  },

  pgMarket(){
    this.mktPrefill();
    const m=this.s.market;
    const INDS=['Technology','Semiconductors','Financial','Healthcare','Consumer','Industrials'];
    const stratCard=(name,zone,bullets)=>`<button type="button" role="radio" aria-checked="${m.strategy===name}" class="strat-card${m.strategy===name?' sel':''}" id="strat-${name==='Higher-Growth Opportunities'?'growth':'long'}" onclick="App.mktSelectStrategy('${name}')">
      <div class="sc-h"><span class="sc-t">${name}</span><span class="badge ${m.strategy===name?'bg':'bw'}">${m.strategy===name?'Selected':'Select'}</span></div>
      <div class="sc-z">${zone}</div>
      <ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
    </button>`;
    const chip=(ind,kind)=>{const on=m[kind].includes(ind);const cls=kind==='preferredIndustries'?'sel':'sel-x';return`<button type="button" class="chip${on?' '+cls:''}" aria-pressed="${on}" onclick="App.mktToggleIndustry('${kind}','${ind}',this)">${ind}</button>`;};
    return `<div class="ph"><div class="pt">Market Recommendations</div><div class="ps">Strategy-driven fund &amp; stock ideas based on your profile</div></div>

    <div class="card" style="margin-bottom:18px">
      <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px">This tool uses your selected <strong>strategy</strong> and profile to evaluate diversified index funds and individual stocks. It applies deterministic screening (liquidity, quality, and — for long-term ideas — proximity to the 200-week EMA) before ranking. Current market data is used only when a live provider is configured; otherwise results are clearly labeled samples. This is educational research, not guaranteed investment advice.</p>
      <div class="mkt-env"><span class="badge bb" id="mkt-mode-badge">Mode set after you generate</span></div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="ct" style="margin-bottom:6px">1 · Choose Your Strategy <span style="color:var(--red)">*</span></div>
      <div class="cs" style="margin-bottom:14px">Only one strategy is active at a time.</div>
      <div class="strat-grid" role="radiogroup" aria-label="Investment strategy">
        ${stratCard('Higher-Growth Opportunities','Approx. 6–18 month horizon · higher volatility tolerance',['Prioritizes earnings &amp; revenue growth','Favors relative strength &amp; constructive momentum','Favors strong industry trends &amp; liquidity','Accepts greater downside for greater potential growth'])}
        ${stratCard('Long-Term Wealth Building','Approx. 3+ year horizon · compounding focus',['Durable competitive advantages','Positive, sustainable cash flow &amp; quality earnings','Manageable debt &amp; industry leadership','Diversified exposure; 200-week EMA as a valuation signal'])}
      </div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="ct" style="margin-bottom:14px">2 · Refine (optional)</div>
      <div class="fr">
        <div class="fg"><label class="fl" for="mkt-amt">Approx. investment amount ($)</label><input class="fi" id="mkt-amt" type="number" min="0" step="100" placeholder="${this.esc(this.s.ob?.purchasingPower||'e.g. 10000')}" value="${this.esc(m.investmentAmount)}"></div>
        <div class="fg"><label class="fl" for="mkt-risk">Risk tolerance</label><select class="fsel" id="mkt-risk">
          ${['Conservative','Moderate','Aggressive'].map(r=>`<option${m.riskTolerance===r?' selected':''}>${r}</option>`).join('')}
        </select></div>
        <div class="fg"><label class="fl" for="mkt-type">Investment type</label><select class="fsel" id="mkt-type">
          <option value="both"${m.investmentType==='both'?' selected':''}>Funds and stocks</option>
          <option value="funds"${m.investmentType==='funds'?' selected':''}>Funds only</option>
          <option value="stocks"${m.investmentType==='stocks'?' selected':''}>Stocks only</option>
        </select></div>
        <div class="fg"><label class="fl" for="mkt-hold">Expected holding period</label><input class="fi" id="mkt-hold" placeholder="e.g. 3+ years" value="${this.esc(m.holdingPeriod)}"></div>
      </div>
      <div class="fg"><label class="fl">Preferred industries</label><div class="cb-group">${INDS.map(i=>chip(i,'preferredIndustries')).join('')}</div></div>
      <div class="fg"><label class="fl">Excluded industries</label><div class="cb-group">${INDS.map(i=>chip(i,'excludedIndustries')).join('')}</div></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:4px">
        <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);cursor:pointer"><input type="checkbox" id="mkt-port" ${m.considerPortfolio?'checked':''} style="accent-color:var(--green)"> Consider my portfolio (${this.s.port.length})</label>
        <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);cursor:pointer"><input type="checkbox" id="mkt-watch" ${m.considerWatchlist?'checked':''} style="accent-color:var(--green)"> Consider my watchlist (${this.s.wl.length})</label>
      </div>
    </div>

    <div style="margin-bottom:18px">
      <button class="btn btn-p btn-lg" id="mkt-gen" ${m.strategy?'':'disabled'} onclick="App.genMarket()">Generate Market Recommendations</button>
      ${m.strategy?'':'<span style="font-size:12px;color:var(--muted);margin-left:10px">Select a strategy to enable</span>'}
    </div>

    <div id="mkt-status" role="status" aria-live="polite" class="sr-only"></div>
    <div id="mkt-results">${m.result?this.renderMarket(m.result):''}</div>`;
  },

  mktSelectStrategy(name){
    this.s.market.strategy=name;this.save();
    ['Higher-Growth Opportunities','Long-Term Wealth Building'].forEach(n=>{
      const id='strat-'+(n==='Higher-Growth Opportunities'?'growth':'long');
      const el=document.getElementById(id);
      if(el){const on=n===name;el.classList.toggle('sel',on);el.setAttribute('aria-checked',on);
        const b=el.querySelector('.badge');if(b){b.textContent=on?'Selected':'Select';b.className='badge '+(on?'bg':'bw');}}
    });
    const gen=document.getElementById('mkt-gen');if(gen){gen.disabled=false;const hint=gen.nextElementSibling;if(hint&&hint.tagName==='SPAN')hint.remove();}
  },

  mktToggleIndustry(kind,ind,btn){
    const arr=this.s.market[kind];const i=arr.indexOf(ind);
    if(i>=0)arr.splice(i,1);else arr.push(ind);
    this.save();
    const on=arr.includes(ind);const cls=kind==='preferredIndustries'?'sel':'sel-x';
    btn.classList.toggle(cls,on);btn.setAttribute('aria-pressed',on);
  },

  async genMarket(){
    const m=this.s.market;
    if(!m.strategy){this.flash('err','Please select a strategy first.');return}
    if(m.loading)return;
    // Gather current form values
    m.investmentAmount=document.getElementById('mkt-amt')?.value||'';
    m.riskTolerance=document.getElementById('mkt-risk')?.value||'Moderate';
    m.investmentType=document.getElementById('mkt-type')?.value||'both';
    m.holdingPeriod=document.getElementById('mkt-hold')?.value||'';
    m.considerPortfolio=!!document.getElementById('mkt-port')?.checked;
    m.considerWatchlist=!!document.getElementById('mkt-watch')?.checked;
    m.loading=true;m.error=null;this.save();
    const btn=document.getElementById('mkt-gen');
    if(btn){btn.disabled=true;btn.textContent='Generating…';}
    const res=document.getElementById('mkt-results');
    const status=document.getElementById('mkt-status');
    const stages=['Reviewing your strategy','Screening eligible funds and companies','Comparing candidates','Preparing research summaries'];
    let si=0;
    const tick=()=>{if(status)status.textContent=stages[si]+'…';if(res)res.innerHTML=`<div class="loading"><div class="spin"></div><p>${stages[si]}…</p></div>`;};
    tick();const iv=setInterval(()=>{si=(si+1)%stages.length;tick();},700);
    try{
      const payload={
        strategy:m.strategy,investmentAmount:m.investmentAmount?Number(m.investmentAmount):null,
        riskTolerance:m.riskTolerance,preferredIndustries:m.preferredIndustries,excludedIndustries:m.excludedIndustries,
        investmentType:m.investmentType,holdingPeriod:m.holdingPeriod,
        considerPortfolio:m.considerPortfolio,considerWatchlist:m.considerWatchlist,
        portfolio:m.considerPortfolio?this.s.port.map(h=>({ticker:h.tk,name:h.nm,note:h.note||''})):[],
        watchlist:m.considerWatchlist?this.s.wl.map(h=>({ticker:h.tk,name:h.nm,note:h.note||''})):[]
      };
      const r=await fetch('/.netlify/functions/market-recommendations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
      clearInterval(iv);
      if(!r.ok){let msg='Request failed.';try{const e=await r.json();msg=e.error||msg;}catch{}throw new Error(msg);}
      const data=await r.json();
      m.result=data;m.loading=false;this.save();
      if(status)status.textContent='Recommendations ready.';
      if(res)res.innerHTML=this.renderMarket(data);
    }catch(err){
      clearInterval(iv);
      m.loading=false;m.error=err.message;this.save();
      if(status)status.textContent='Error: '+err.message;
      if(res)res.innerHTML=`<div class="alert al-d" role="alert">⚠ ${this.esc(err.message)}<br><span style="font-size:12px;opacity:.85">If you are running the standalone file directly, the Market Recommendations server function is only available on the deployed Netlify site. Demo data requires no keys once deployed.</span></div>`;
    }finally{
      const b=document.getElementById('mkt-gen');
      if(b){b.disabled=false;b.textContent='Generate Market Recommendations';}
    }
  },

  mktModeBadgeClass(status){
    return status==='Live Data'?'bg':status==='Demo Data'?'by':status==='Data Unavailable'?'br':'bb';
  },

  renderMarket(d){
    const badge=(txt,cls)=>`<span class="badge ${cls}">${this.esc(txt)}</span>`;
    const riskCls=r=>r==='Low'?'bg':r==='High'?'br':'by';
    const confCls=c=>c==='High'?'bg':c==='Low'?'br':'by';
    const env=`<div class="card" style="margin-bottom:16px">
      <div class="mkt-env">
        ${badge(d.dataStatus,this.mktModeBadgeClass(d.dataStatus))}
        ${badge('Provider: '+d.dataProvider,'bw')}
        ${badge('Feed: '+d.feedType,'bw')}
      </div>
      <div class="mkt-meta">
        <div class="mm"><div class="mm-l">Strategy</div><div class="mm-v">${this.esc(d.strategy)}</div></div>
        <div class="mm"><div class="mm-l">Time Horizon</div><div class="mm-v">${this.esc(d.timeHorizon)}</div></div>
        <div class="mm"><div class="mm-l">Risk</div><div class="mm-v">${this.esc(d.riskTolerance)}</div></div>
        <div class="mm"><div class="mm-l">Data As Of</div><div class="mm-v">${this.esc((d.dataTimestamp||'').slice(0,16).replace('T',' '))}</div></div>
      </div>
      <p style="font-size:13px;color:var(--text2);line-height:1.6">${this.esc(d.marketContextSummary)}</p>
      ${d.allocationConsiderations?`<div class="alert al-b" style="margin-top:12px">${this.esc(d.allocationConsiderations)}</div>`:''}
      ${(d.limitations&&d.limitations.length)?`<div style="margin-top:12px"><div class="mm-l" style="margin-bottom:5px">Data Limitations</div><ul class="risk-list">${d.limitations.map(l=>`<li>${this.esc(l)}</li>`).join('')}</ul></div>`:''}
    </div>`;

    const metricRows=km=>(km||[]).map(x=>`<div class="km-row"><span class="km-l">${this.esc(x.label)}</span><span class="km-v">${this.esc(x.value)}${x.asOf?` <span class="km-s">(${this.esc(x.asOf)})</span>`:''}</span></div>`).join('');

    const fundCard=f=>`<div class="rec">
      <div class="rec-rnk"><span class="badge bb">${f.score}</span></div>
      <div class="rec-sk" style="font-size:18px">${this.esc(f.ticker)}</div>
      <div class="rec-sub">${this.esc(f.name)} · ${this.esc(f.category||'Fund')}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">${badge(f.riskLevel+' risk',riskCls(f.riskLevel))}${badge(f.confidence+' confidence',confCls(f.confidence))}${badge('Data: '+f.dataCompleteness,'bw')}</div>
      <p style="font-size:12px;color:var(--text2);line-height:1.6">${this.esc(f.reasoning)}</p>
      ${f.whyNow?`<p style="font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px"><strong>Why now:</strong> ${this.esc(f.whyNow)}</p>`:''}
      ${(f.keyRisks&&f.keyRisks.length)?`<ul class="risk-list">${f.keyRisks.map(r=>`<li>${this.esc(r)}</li>`).join('')}</ul>`:''}
      ${f.portfolioOverlap?`<p style="font-size:11px;color:var(--muted);margin-top:8px">${this.esc(f.portfolioOverlap)}</p>`:''}
      <div class="km">${metricRows(f.keyMetrics)}</div>
      <div class="rec-acts"><button class="btn btn-g btn-sm" onclick="App.mktAddWatch('${this.esc(f.ticker)}','${this.esc(f.name)}','${this.esc(f.category||'Fund')}')">+ Watchlist</button></div>
    </div>`;

    const stockCard=s=>`<div class="rec">
      <div class="rec-rnk"><span class="badge bb">${s.score}</span></div>
      <div class="rec-sk" style="font-size:18px">${this.esc(s.ticker)}</div>
      <div class="rec-sub">${this.esc(s.name)} · ${this.esc(s.industry||'')}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">${badge(s.riskLevel+' risk',riskCls(s.riskLevel))}${badge(s.confidence+' confidence',confCls(s.confidence))}${badge('Data: '+s.dataCompleteness,'bw')}</div>
      <p style="font-size:12px;color:var(--text2);line-height:1.6">${this.esc(s.reasoning)}</p>
      ${s.whyNow?`<p style="font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px"><strong>Why now:</strong> ${this.esc(s.whyNow)}</p>`:''}
      ${s.distanceFrom200WeekEma?`<p style="font-size:11px;color:var(--green);margin-top:8px">200-wk EMA: ${this.esc(s.distanceFrom200WeekEma)}</p>`:''}
      ${(s.keyRisks&&s.keyRisks.length)?`<ul class="risk-list">${s.keyRisks.map(r=>`<li>${this.esc(r)}</li>`).join('')}</ul>`:''}
      ${s.portfolioOverlap?`<p style="font-size:11px;color:var(--muted);margin-top:8px">${this.esc(s.portfolioOverlap)}</p>`:''}
      <div class="km">${metricRows(s.keyMetrics)}</div>
      <div class="rec-acts">
        <button class="btn btn-g btn-sm" onclick="App.mktAddWatch('${this.esc(s.ticker)}','${this.esc(s.name)}','${this.esc(s.industry||'')}')">+ Watchlist</button>
        <button class="btn btn-g btn-sm" onclick="App.mktToScreener('${this.esc(s.ticker)}')">Screener</button>
        <button class="btn btn-g btn-sm" onclick="App.go('research',{ticker:'${this.esc(s.ticker)}'})">Research</button>
        <button class="btn btn-g btn-sm" onclick="App.go('leaps',{ticker:'${this.esc(s.ticker)}'})">LEAPS</button>
      </div>
    </div>`;

    const funds=(d.funds&&d.funds.length)?`<div class="ct" style="margin:6px 0 10px">Diversified Funds</div><div class="rec-grid">${d.funds.map(fundCard).join('')}</div>`:'';
    const stocks=(d.stocks&&d.stocks.length)?`<div class="ct" style="margin:14px 0 10px">Individual Stocks</div><div class="rec-grid">${d.stocks.map(stockCard).join('')}</div>`:'';
    const empty=(!d.funds||!d.funds.length)&&(!d.stocks||!d.stocks.length)?`<div class="empty"><div class="empty-ic">◇</div><h3>No candidates passed the filters</h3><p>Try widening industries or switching investment type.</p></div>`:'';

    return env+funds+stocks+empty+`<p style="font-size:11px;color:var(--muted);margin-top:14px">${this.esc(d.disclaimer)}</p>`;
  },

  mktAddWatch(tk,nm,ind){
    if(this.s.wl.find(x=>x.tk===tk)){this.flash('err',tk+' is already in your watchlist.');return}
    this.s.wl.push({id:Date.now(),tk,nm,ind:ind||'',conf:3,note:'Added from Market Recommendations',added:new Date().toLocaleDateString()});
    this.save();this.flash('ok',tk+' added to your watchlist.');
  },

  mktToScreener(tk){
    this.go('screener');
    setTimeout(()=>{if(typeof COMPANIES!=='undefined'&&COMPANIES[tk])this.loadMock(tk);else{const el=document.getElementById('sc-tk');if(el)el.value=tk;}},80);
  },

  // ============================================================
  // EVENT BINDING
  // ============================================================
  bind(){
    document.querySelectorAll('.cb-item').forEach(el=>{
      el.addEventListener('click',function(){
        this.classList.toggle('checked');
        const checked=[...document.querySelectorAll('.cb-item.checked')].map(x=>x.dataset.val);
        App.s.obData.industries=checked;
      });
    });
    // Scroll chat to bottom
    const cm=document.getElementById('chat-msgs');
    if(cm)cm.scrollTop=cm.scrollHeight;
  }
};

// ============================================================
// INIT
// ============================================================
App.load();
App.render();
</script>
</body>
</html>

name: CI

on:
  push:
    branches:
      - claude/leaps-research-assistant-mvp-t7voo2 # current default branch
      - claude/leaps-status-report-0ejjsk # Phase 1 branch
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (report only)
        run: npm audit --audit-level=critical

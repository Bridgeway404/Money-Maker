name: CI

on:
  push:
    branches:
      # `main` is listed ahead of the rename so push CI keeps working the moment
      # the default branch is renamed. The current Claude-named default is kept
      # until the GitHub rename actually happens; remove it in the Phase 1.5 PR.
      - main
      - claude/leaps-research-assistant-mvp-t7voo2 # current default branch (pre-rename)
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (report only)
        run: npm audit --audit-level=critical
